name: Serverless Deployment Pipeline

on:
  push:
    branches:
      - main
      - feature/*
  workflow_dispatch: # Allows manual trigger

env:
  AWS_REGION: us-east-1

jobs:
  # ---------------------------------------------------------
  # DEV ENVIRONMENT DEPLOYMENT
  # ---------------------------------------------------------
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform -chdir=./terraform/environments/dev init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform Plan
        run: terraform -chdir=./terraform/environments/dev plan -out=tfplan -var="environment_name=dev" -var="region=${{ env.AWS_REGION }}"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')
        run: terraform -chdir=./terraform/environments/dev apply -auto-approve tfplan

  # ---------------------------------------------------------
  # STAGING ENVIRONMENT DEPLOYMENT (Requires Manual Approval)
  # ---------------------------------------------------------
  deploy-staging:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging # Links to GitHub Environment protection rules
    if: github.ref == 'refs/heads/main' # Only deploy to staging from main
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform -chdir=./terraform/environments/staging init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform Plan
        run: terraform -chdir=./terraform/environments/staging plan -out=tfplan -var="environment_name=staging" -var="region=${{ env.AWS_REGION }}"

      - name: Terraform Apply
        run: terraform -chdir=./terraform/environments/staging apply -auto-approve tfplan

  # ---------------------------------------------------------
  # PROD ENVIRONMENT (BLUE/GREEN DEPLOYMENT)
  # ---------------------------------------------------------
  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: prod # Links to GitHub Environment protection rules for Prod
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform -chdir=./terraform/environments/prod init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform Apply (Publish Green Version)
        # Publishes the new version while lifecycle blocks leave LIVE alias intact
        run: terraform -chdir=./terraform/environments/prod apply -auto-approve -var="environment_name=prod" -var="region=${{ env.AWS_REGION }}" -var="version_label=Green"

      - name: Perform Blue/Green Traffic Shift
        run: |
          # 1. Target function and fetch highest published numeric version (excluding $LATEST)
          FUNCTION_NAME="hello-api-prod"
          NEW_VERSION=$(aws lambda list-versions-by-function --function-name $FUNCTION_NAME --query "Versions[?Version!='\$LATEST'] | [-1].Version" --output text)
          
          echo "Newly published numeric version is: $NEW_VERSION"

          # 2. Assign the new version to the STANDBY alias
          aws lambda update-alias --function-name $FUNCTION_NAME --name STANDBY --function-version $NEW_VERSION
          echo "STANDBY alias updated to version $NEW_VERSION."

          # 3. Shift live traffic to the new Green version
          aws lambda update-alias --function-name $FUNCTION_NAME --name LIVE --function-version $NEW_VERSION
          echo "Traffic shifted! LIVE alias is now serving version $NEW_VERSION (Green)."